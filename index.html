<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bốn mùa</title>
  <style>
    :root {
      --bg-khung: #FFFDE7;
      --border-khung: #9E9E9E;
      --bg-tieude: #FFD9E6;
      --mau-do: #D40000;
      --mau-xanh: #0033CC;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: "Times New Roman", Times, serif;
      padding: 20px;
    }

    .khung-tho {
      background-color: var(--bg-khung);
      border: 1px solid var(--border-khung);
      width: 640px;
      max-width: 100%;
      padding: 24px;
      text-align: center;
    }

    h1 {
      color: var(--mau-do);
      background-color: var(--bg-tieude);
      font-size: 26px;
      padding: 6px 0;
      margin: 0 0 20px;
    }

    p {
      font-style: italic;
      line-height: 1.7;
      font-size: 18px;
    }

    .kho-xanh {
      color: var(--mau-xanh);
    }

    .kho-do {
      color: var(--mau-do);
    }

    hr {
      border: none;
      height: 1px;
      background-color: var(--mau-xanh);
      width: 52%;
      margin: 16px auto;
    }
  </style>
</head>
<body>

  <article class="khung-tho">
    <h1>BỐN MÙA</h1>

    <p class="kho-xanh">
      Xuân về hoa nở khắp trời<br>
      Hạ sang nắng cháy rạng ngời phố quen<br>
      Thu về lá rụng bên thềm
    </p>

    <hr>

    <p class="kho-do">
      Đông sang gió lạnh bên em đợi chờ<br>
      Bốn mùa là bốn giấc mơ<br>
      Thời gian đi mãi ta chờ đợi ai
    </p>

    <hr>

    <p class="kho-xanh">
      Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
      Chờ xuân nắng mới soi đường
    </p>
  </article>

</body>
</html>
